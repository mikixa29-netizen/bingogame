<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edil Bingo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #a483cf;
            font-family: Arial, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header-title {
            font-size: 24px;
            font-weight: bold;
            margin: 10px 0;
            letter-spacing: 1px;
        }
        .top-stats {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            padding: 0 10px;
        }
        .stat-box {
            background: #ffffff;
            color: #333;
            border-radius: 12px;
            padding: 5px 12px;
            text-align: center;
            min-width: 50px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .stat-box .label {
            font-size: 10px;
            color: #666;
            text-transform: uppercase;
            font-weight: bold;
        }
        .stat-box .value {
            font-size: 14px;
            font-weight: bold;
            color: #222;
        }

        /* Selection Screen Styles */
        #selection-screen {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .number-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            background: rgba(255, 255, 255, 0.15);
            padding: 10px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            margin-bottom: 15px;
            max-height: 220px;
            overflow-y: auto;
        }
        .num-cell {
            background: #e2d1f9;
            color: #333;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .num-cell.selected {
            background: #008000;
            color: #fff;
        }

        .mini-cartela-preview {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 3px;
            background: #f3eafa;
            padding: 6px;
            border-radius: 6px;
            width: 150px;
            margin-bottom: 15px;
        }
        .mini-cell {
            background: #fff;
            color: #333;
            font-size: 11px;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 2px;
            font-weight: bold;
        }
        .mini-cell.star {
            background: #008000;
            color: #fff;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            width: 90%;
            max-width: 380px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .btn-refresh {
            background: #209cee;
            color: white;
            border: none;
            padding: 12px 0;
            flex: 1;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-start {
            background: #ff6600;
            color: white;
            border: none;
            padding: 12px 0;
            flex: 1;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Active Game Screen Styles */
        #game-screen {
            display: none;
            width: 100%;
            max-width: 450px;
            flex-direction: column;
            align-items: center;
        }
        .game-main-area {
            display: flex;
            width: 95%;
            gap: 10px;
            margin-top: 10px;
        }
        .board-column {
            background: #f3eafa;
            border-radius: 8px;
            padding: 5px;
            width: 45%;
        }
        .bingo-header-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .bingo-header-row div:nth-child(1) { color: #ff9800; }
        .bingo-header-row div:nth-child(2) { color: #4caf50; }
        .bingo-header-row div:nth-child(3) { color: #03a9f4; }
        .bingo-header-row div:nth-child(4) { color: #f44336; }
        .bingo-header-row div:nth-child(5) { color: #9c27b0; }

        .board-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .board-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
        }
        .board-item {
            background: #e2d1f9;
            color: #333;
            font-size: 11px;
            text-align: center;
            padding: 4px 0;
            border-radius: 2px;
            font-weight: bold;
        }
        .board-item.called {
            background: #008000 !important;
            color: #fff !important;
        }

        .call-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .status-box {
            background: #e2d1f9;
            border-radius: 8px;
            padding: 8px;
            text-align: center;
        }
        .status-box .title {
            font-size: 11px;
            color: #555;
            text-transform: uppercase;
        }
        .status-box .val {
            font-size: 16px;
            font-weight: bold;
            color: #4a154b;
        }
        .current-call-box {
            background: #6c3483;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }
        .current-call-badge {
            background: #ff6600;
            color: white;
            font-size: 20px;
            font-weight: bold;
            padding: 12px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            margin-top: 5px;
        }

        .user-cartela {
            background: #f3eafa;
            border-radius: 8px;
            padding: 8px;
            margin-top: 5px;
            width: 100%;
        }
        .user-cartela-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 3px;
        }
        .ucell {
            background: #fff;
            color: #333;
            font-size: 12px;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
            font-weight: bold;
        }
        .ucell.marked {
            background: #008000 !important;
            color: #fff !important;
        }

        .btn-bingo {
            background: linear-gradient(to bottom, #ff9800, #ff5722);
            color: white;
            border: none;
            width: 90%;
            padding: 14px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .bottom-action-row {
            display: flex;
            gap: 10px;
            width: 90%;
            margin-top: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="header-title">Addis Bingo</div>

    <!-- 1. SELECTION SCREEN -->
    <div id="selection-screen">
        <div class="top-stats">
            <div class="stat-box"><div class="label">Wallet</div><div class="value" id="wallet-val">{{ balance }}</div></div>
            <div class="stat-box"><div class="label">Active Game</div><div class="value">2</div></div>
            <div class="stat-box"><div class="label">Stake</div><div class="value" id="stake-val">{{ entry_price }}</div></div>
        </div>

        <!-- 1 to 100 Cartelas Grid -->
        <div class="number-grid" id="numberGrid"></div>

        <!-- Selected Cartela Preview -->
        <div style="font-size:13px; margin-bottom:5px;" id="selectedCartelaLbl">Selected Cartela: #82</div>
        <div class="mini-cartela-preview" id="miniCartela"></div>

        <div class="action-buttons">
            <button class="btn-refresh" onclick="location.reload()">Refresh</button>
            <button class="btn-start" onclick="startGame()">Start game</button>
        </div>
    </div>


    <!-- 2. ACTIVE GAME PLAY SCREEN -->
    <div id="game-screen">
        <div class="top-stats">
            <div class="stat-box"><div class="label">Game</div><div class="value">EF0565</div></div>
            <div class="stat-box"><div class="label">Derash</div><div class="value" id="pool-val">104</div></div>
            <div class="stat-box"><div class="label">Bonus</div><div class="value">On</div></div>
            <div class="stat-box"><div class="label">Players</div><div class="value">13</div></div>
            <div class="stat-box"><div class="label">Bet</div><div class="value">{{ entry_price }}</div></div>
            <div class="stat-box"><div class="label">Call</div><div class="value" id="call-count">0</div></div>
        </div>

        <div class="game-main-area">
            <div class="board-column">
                <div class="bingo-header-row">
                    <div>B</div><div>I</div><div>N</div><div>G</div><div>O</div>
                </div>
                <div class="board-list" id="mainBoardList"></div>
            </div>

            <div class="call-area">
                <div class="status-box">
                    <div class="title">Count Down</div>
                    <div class="val" id="countdown-timer">Started</div>
                </div>

                <div class="current-call-box">
                    <div style="font-size:11px; color:#ddd;">Current Call</div>
                    <div class="current-call-badge" id="currentCallBadge">-</div>
                </div>

                <div class="user-cartela">
                    <div class="bingo-header-row" style="font-size:11px;">
                        <div>B</div><div>I</div><div>N</div><div>G</div><div>O</div>
                    </div>
                    <div class="user-cartela-grid" id="userCartelaGrid"></div>
                    <div style="text-align:center; font-size:10px; margin-top:4px; color:#555;" id="boardNumberLbl">Board number 82</div>
                </div>
            </div>
        </div>

        <button class="btn-bingo" onclick="triggerBingo()">BINGO!</button>

        <div class="bottom-action-row">
            <button class="btn-refresh" onclick="location.reload()">Refresh</button>
            <button class="btn-start" style="background:#e74c3c;" onclick="location.reload()">Leave</button>
        </div>
    </div>

    <script>
        let selectedCartelaId = 82;
        let calledNumbersList = [];
        let activeCartelaNumbers = [];

        // 1 እስከ 100 ያሉትን 100 የተለዩ ካርቴላዎች በቁጥር ልኬት (Seed) ማመንጫ ሎጂክ
        function generateCartelaNumbers(id) {
            let numbers = [];
            // B column (1-15)
            let bCol = getUniqueRandoms(1, 15, 5, id);
            // I column (16-30)
            let iCol = getUniqueRandoms(16, 30, 5, id + 10);
            // N column (31-45), center is '*'
            let nCol = getUniqueRandoms(31, 45, 4, id + 20);
            nCol.splice(2, 0, '*');
            // G column (46-60)
            let gCol = getUniqueRandoms(46, 60, 5, id + 30);
            // O column (61-75)
            let oCol = getUniqueRandoms(61, 75, 5, id + 40);

            // አቀማመጡን በረድፍ (Row-wise) ማስተካከል
            for (let r = 0; r < 5; r++) {
                numbers.push(bCol[r]);
                numbers.push(iCol[r]);
                numbers.push(nCol[r]);
                numbers.push(gCol[r]);
                numbers.push(oCol[r]);
            }
            return numbers;
        }

        function getUniqueRandoms(min, max, count, seed) {
            let arr = [];
            for (let i = min; i <= max; i++) arr.push(i);
            // በ seed ላይ ተመስርቶ ቁጥሮቹን መቀያየር (Pseudorandom per cartela ID)
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor((Math.sin(seed + i) + 1) * 0.5 * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr.slice(0, count);
        }

        // 1 እስከ 100 ካሉት ቁጥሮች የካርቴላ መምረጫ ግሪድ መሥራት
        const gridContainer = document.getElementById('numberGrid');
        for (let i = 1; i <= 100; i++) {
            let cell = document.createElement('div');
            cell.className = 'num-cell' + (i === selectedCartelaId ? ' selected' : '');
            cell.innerText = i;
            cell.onclick = () => {
                document.querySelectorAll('.num-cell').forEach(c => c.classList.remove('selected'));
                cell.classList.add('selected');
                selectedCartelaId = i;
                document.getElementById('selectedCartelaLbl').innerText = "Selected Cartela: #" + i;
                updatePreview();
            };
            gridContainer.appendChild(cell);
        }

        function updatePreview() {
            activeCartelaNumbers = generateCartelaNumbers(selectedCartelaId);
            const mini = document.getElementById('miniCartela');
            mini.innerHTML = '';
            activeCartelaNumbers.forEach(num => {
                let mcell = document.createElement('div');
                mcell.className = 'mini-cell' + (num === '*' ? ' star' : '');
                mcell.innerText = num;
                mini.appendChild(mcell);
            });
        }
        updatePreview();

        // Build Main 1-75 Board
        const mainBoardList = document.getElementById('mainBoardList');
        for (let r = 1; r <= 15; r++) {
            let rowDiv = document.createElement('div');
            rowDiv.className = 'board-row';
            for (let c = 0; c < 5; c++) {
                let num = r + (c * 15);
                let item = document.createElement('div');
                item.className = 'board-item';
                item.id = 'bnum-' + num;
                item.innerText = num;
                rowDiv.appendChild(item);
            }
            mainBoardList.appendChild(rowDiv);
        }

        function startGame() {
            document.getElementById('selection-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            document.getElementById('boardNumberLbl').innerText = "Board number " + selectedCartelaId;

            // የተመረጠውን ካርቴላ ወደ ጨዋታው ሰሌዳ ማስገባት
            const uGrid = document.getElementById('userCartelaGrid');
            uGrid.innerHTML = '';
            activeCartelaNumbers.forEach(num => {
                let ucell = document.createElement('div');
                ucell.className = 'ucell' + (num === '*' ? ' marked' : '');
                ucell.innerText = num;
                ucell.id = 'ucell-' + num;
                uGrid.appendChild(ucell);
            });

            // የ 30 ሰከንድ ቆጠራ
            let count = 30;
            let timerInterval = setInterval(() => {
                count--;
                if(count > 0) {
                    document.getElementById('countdown-timer').innerText = count + 's';
                } else {
                    clearInterval(timerInterval);
                    document.getElementById('countdown-timer').innerText = 'Started';
                    startCallingNumbers();
                }
            }, 1000);
        }

        function startCallingNumbers() {
            let availableNumbers = [];
            for(let i=1; i<=75; i++) availableNumbers.push(i);
            availableNumbers.sort(() => Math.random() - 0.5);

            let callIndex = 0;
            let callInterval = setInterval(() => {
                if(callIndex >= availableNumbers.length) {
                    clearInterval(callInterval);
                    return;
                }
                let currentNum = availableNumbers[callIndex];
                callIndex++;

                calledNumbersList.push(currentNum);
                document.getElementById('call-count').innerText = calledNumbersList.length;

                let letter = 'B';
                if(currentNum > 15 && currentNum <= 30) letter = 'I';
                else if(currentNum > 30 && currentNum <= 45) letter = 'N';
                else if(currentNum > 45 && currentNum <= 60) letter = 'G';
                else if(currentNum > 60) letter = 'O';

                document.getElementById('currentCallBadge').innerText = letter + '-' + currentNum;

                let boardItem = document.getElementById('bnum-' + currentNum);
                if(boardItem) boardItem.classList.add('called');

                let userCell = document.getElementById('ucell-' + currentNum);
                if(userCell) userCell.classList.add('marked');

            }, 3000);
        }

        function triggerBingo() {
            alert('🎉 BINGO! Congratulations, your claim has been submitted!');
        }
    </script>
</body>
</html>
