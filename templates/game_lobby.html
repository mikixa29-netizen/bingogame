<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Edil Bingo - Lobby</title>
    <link href="https://fonts.googleapis.com/css2?family=Inria+Serif:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Inria Serif', serif; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 12px;
            background-color: #89C149;
            color: #FFFEFE;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding-bottom: 80px;
        }
        
        .app-header {
            width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center;
            padding: 8px 12px; font-size: 13.5px; font-weight: bold; margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.2); border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .live-indicator { display: flex; align-items: center; gap: 6px; color: #fff; }
        .live-dot { width: 9px; height: 9px; background-color: #2ecc71; border-radius: 50%; box-shadow: 0 0 8px #2ecc71; }

        .section-header {
            width: 100%; max-width: 440px; display: flex; align-items: center; gap: 6px;
            font-size: 16px; font-weight: bold; color: #ffffff; margin: 10px 0 6px 0; letter-spacing: 0.5px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        
        .table-headers {
            width: 100%; max-width: 440px; display: grid; grid-template-columns: 1fr 1.5fr 1fr;
            padding: 6px 10px; font-size: 11px; font-weight: bold; opacity: 0.95; text-transform: uppercase;
        }
        .table-headers div:nth-child(2) { text-align: center; }
        .table-headers div:nth-child(3) { text-align: right; }

        .room-card {
            background: rgba(255, 255, 255, 0.25); border-radius: 16px; width: 100%; max-width: 440px;
            margin-bottom: 12px; position: relative; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15); backdrop-filter: blur(5px);
        }
        .room-row-content { display: grid; grid-template-columns: 1fr 1.5fr 1fr; align-items: center; padding: 12px 12px 8px 12px; }
        .room-bet { font-size: 22px; font-weight: bold; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        .room-bet span { font-size: 11px; display: block; opacity: 0.9; }
        
        .room-win-info { text-align: center; display: flex; flex-direction: column; align-items: center; }
        .win-amount { font-size: 18px; font-weight: bold; color: #fdd835; display: flex; align-items: center; gap: 4px; text-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        .win-players { font-size: 11px; opacity: 0.95; margin-top: 2px; }

        .room-action-area { display: flex; flex-direction: column; align-items: flex-end; position: relative; }
        
        .status-badge-container { display: flex; flex-direction: column; align-items: flex-end; }
        .status-badge { font-size: 10px; font-weight: bold; padding: 3px 8px; border-radius: 6px; margin-bottom: 3px; text-align: center; }
        .status-badge.active-count { background: #3498db; color: white; }
        .status-badge.ready { background: rgba(46, 204, 113, 0.85); color: white; }
        .starts-timer-box { 
            background: rgba(255, 255, 255, 0.3); border: 1px solid rgba(255,255,255,0.5); 
            border-radius: 6px; padding: 2px 8px; text-align: center; font-size: 10px; font-weight: bold; margin-bottom: 4px; 
        }

        .btn-join {
            background: #27ae60; color: white; border: none; padding: 7px 22px; border-radius: 18px;
            font-size: 13px; font-weight: bold; cursor: pointer; text-decoration: none; text-align: center; margin-top: 2px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2); transition: transform 0.1s;
        }
        .btn-join:active { transform: scale(0.95); }

        .jackpot-bar-container { width: 100%; background: rgba(0,0,0,0.3); height: 14px; position: relative; margin-top: 6px; display: flex; align-items: center; }
        .jackpot-text { position: absolute; width: 100%; text-align: center; font-size: 9px; font-weight: bold; color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.8); z-index: 2; }
        .jackpot-fill { height: 100%; background: #fdd835; transition: width 0.4s ease; z-index: 1; }

        .demo-card {
            background: rgba(255, 255, 255, 0.25); border-radius: 16px; width: 100%; max-width: 440px;
            margin-bottom: 12px; padding: 14px 12px; display: flex; justify-content: space-between; align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.4); box-shadow: 0 6px 15px rgba(0,0,0,0.15); backdrop-filter: blur(5px);
        }
        .demo-info div:first-child { font-size: 16px; font-weight: bold; color: #fff; display: flex; align-items: center; gap: 6px; text-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        .demo-info div:last-child { font-size: 11px; opacity: 0.9; margin-top: 3px; }
        .demo-buttons { display: flex; gap: 8px; }
        .btn-open { background: rgba(255,255,255,0.3); color: white; border: none; padding: 7px 14px; border-radius: 16px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .btn-try { background: #34495e; color: white; border: none; padding: 7px 18px; border-radius: 16px; font-size: 12px; font-weight: bold; cursor: pointer; box-shadow: 0 3px 6px rgba(0,0,0,0.2); }

        /* Bottom Nav - Modern Unified Design */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; background: #ffffff;
            display: flex; justify-content: space-around; padding: 10px 0;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.15); z-index: 1000;
            border-top-left-radius: 16px; border-top-right-radius: 16px;
        }
        .nav-item { 
            display: flex; flex-direction: column; align-items: center; text-decoration: none; 
            color: #777; font-size: 11px; font-weight: bold; transition: 0.2s ease;
        }
        .nav-item span { font-size: 18px; margin-bottom: 2px; }
        .nav-item.active { color: #27ae60; transform: translateY(-2px); }
    </style>
</head>
<body>

    <!-- Header Stats -->
    <div class="app-header">
        <div class="live-indicator"><div class="live-dot"></div> በህይወት (Live)</div>
        <div>ቦነስ: <span id="hdr-bonus" style="color: #fdd835;">{{ bonus_balance | default('0.00') }}</span> ብር</div>
        <div>ባላንስ: <span id="hdr-balance" style="color: #fdd835;">{{ main_balance | default('0.00') }}</span> ብር</div>
    </div>

    <!-- BINGO GAMES SECTION HEADER -->
    <div class="section-header">🎮 የቢንጎ ጨዋታ ክፍሎች (BINGO ROOMS)</div>
    <div class="table-headers">
        <div>መደብ (Bet)</div>
        <div>ሽልማት / ተጫዋች</div>
        <div style="text-align: right;">ሁኔታ እና መግቢያ</div>
    </div>

    <!-- Dynamic Room List Container -->
    <div id="rooms-container" style="width: 100%; max-width: 440px;"></div>

    <!-- FREE PRACTICE MODE -->
    <div class="demo-card">
        <div class="demo-info">
            <div>🎮 <span>የነጻ ልምምድ (Demo Mode)</span></div>
            <div>እውነተኛ ገንዘብ አይጠይቅም (እስከ 5 ካርቴላ)</div>
        </div>
        <div class="demo-buttons">
            <button class="btn-open" onclick="alert('የዴሞ ጨዋታ ደንብ: በነጻ ካርቴላዎች መለማመድ ይችላሉ!')">መመሪያ</button>
            <button class="btn-try" onclick="startDemoMode()">ሞክር</button>
        </div>
    </div>

    <!-- 5ቱ ሜኑዎች በሞደርን ሲኤስኤስ ዲዛይን -->
    <div class="bottom-nav">
        <a href="/" class="nav-item active"><span>🎮</span> ጨዋታ</a>
        <a href="/scores" class="nav-item"><span>🏆</span> ፉክክር</a>
        <a href="/history" class="nav-item"><span>📋</span> ታሪክ</a>
        <a href="/wallet" class="nav-item"><span>💰</span> ዋሌት</a>
        <a href="/profile" class="nav-item"><span>👤</span> ප්‍රိုፋይል</a>
    </div>

    <script>
        const roomStakes = [10, 20, 50, 100];
        const deductionPercentages = { 10: 0.0125, 20: 0.0175, 50: 0.02, 100: 0.04 };

        function fetchGamesLobbyData() {
            fetch('/game/list')
            .then(res => res.json())
            .then(data => {
                if(data.user_balance !== undefined) {
                    document.getElementById('hdr-balance').innerText = parseFloat(data.user_balance).toFixed(2);
                }
                if(data.user_bonus !== undefined) {
                    document.getElementById('hdr-bonus').innerText = parseFloat(data.user_bonus).toFixed(2);
                }
                renderRooms(data.games || data);
            })
            .catch(err => console.log('Error fetching game status:', err));
        }

        function renderRooms(gamesData) {
            const container = document.getElementById('rooms-container');
            if(!container) return;
            container.innerHTML = '';

            roomStakes.forEach((stake, index) => {
                const gameId = index + 1;
                let gData = Array.isArray(gamesData) ? (gamesData.find(g => g.entry_price === stake) || {}) : {};

                const activePlayers = gData.players || 0;
                const deductionRate = deductionPercentages[stake] || 0.02;
                const totalPool = activePlayers > 0 ? (activePlayers * stake) * (1 - deductionRate) : 0;
                const winAmount = activePlayers > 0 ? totalPool : 0;
                
                const status = gData.status || 'waiting';
                const countdown = gData.countdown_remaining || 0;

                const jackpotCurrent = gData.jackpot_pool || (winAmount * 0.15).toFixed(1);
                const jackpotMax = stake * 50; 
                const jackpotPct = Math.min(100, (jackpotCurrent / jackpotMax) * 100).toFixed(1);

                let statusBadgeHtml = '';
                if (status === 'countdown') {
                    const secs = countdown < 10 ? `0${countdown}` : countdown;
                    statusBadgeHtml = `
                        <div class="status-badge active-count">ተጫዋቾች ${activePlayers}</div>
                        <div class="starts-timer-box">ይጀምራል 0:${secs}</div>
                    `;
                } else if (status === 'active' || status === 'playing') {
                    statusBadgeHtml = `
                        <div class="status-badge active-count" style="background:#e67e22;">በመጫወት ላይ</div>
                    `;
                } else {
                    statusBadgeHtml = `
                        <div class="status-badge ready">ዝግጁ (${activePlayers})</div>
                    `;
                }

                const roomCard = document.createElement('div');
                roomCard.className = 'room-card';
                roomCard.innerHTML = `
                    <div class="room-row-content">
                        <div class="room-bet">${stake} <span>ብር</span></div>
                        <div class="room-win-info">
                            <div class="win-amount">🏆 ${winAmount.toFixed(0)} ብር</div>
                            <div class="win-players">${activePlayers} ተጫዋቾች</div>
                        </div>
                        <div class="room-action-area">
                            <div class="status-badge-container">
                                ${statusBadgeHtml}
                            </div>
                            <button class="btn-join" onclick="joinRoom(${gData.id || gameId}, ${stake}, '${status}')">ግባ</button>
                        </div>
                    </div>
                    <div class="jackpot-bar-container">
                        <div class="jackpot-text">ጃክፖት (JACKPOT) ${jackpotCurrent} / ${jackpotMax}</div>
                        <div class="jackpot-fill" style="width: ${jackpotPct}%;"></div>
                    </div>
                `;
                container.appendChild(roomCard);
            });
        }

        function joinRoom(gameId, entryPrice, status) {
            fetch('/game/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ entry_price: entryPrice, game_id: gameId })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    const targetGameId = data.game_id || gameId;
                    if (data.has_cartela || status === 'active' || status === 'playing') {
                        window.location.href = `/game/${targetGameId}`;
                    } else {
                        window.location.href = `/game/${targetGameId}/select_cartela`;
                    }
                } else if (data.error) {
                    alert(data.error);
                }
            })
            .catch(err => {
                window.location.href = `/game/${gameId}/select_cartela`;
            });
        }

        function startDemoMode() {
            fetch('/game/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ entry_price: 0, game_id: 999 })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    window.location.href = data.has_cartela ? `/game/999` : `/game/999/select_cartela`;
                } else {
                    window.location.href = `/game/999/select_cartela`;
                }
            })
            .catch(err => {
                window.location.href = `/game/999/select_cartela`;
            });
        }

        setInterval(fetchGamesLobbyData, 1000);
        fetchGamesLobbyData();
    </script>
</body>
</html>
